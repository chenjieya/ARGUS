# ARGUS 反向代理片段
# 放到 nginx 的 conf.d/ 或 sites-enabled/ 里，或在 blog 容器已有配置中追加一个 server 块。
# 假设：docker-compose 已把 ARGUS 绑到宿主机 127.0.0.1:8848

server {
    listen 80;
    listen [::]:80;
    server_name argus.example.com;

    # 全站跳 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name argus.example.com;

    ssl_certificate     /etc/letsencrypt/live/argus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/argus.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 面板体积小，关掉多余缓冲
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # WebSocket 长连接
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # 可选：只允许内网 / 固定 IP 访问
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;
}
