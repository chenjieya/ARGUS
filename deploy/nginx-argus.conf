# ARGUS // 全视守望 —— status.alvis.org.cn
# 上游：docker compose 把容器绑在宿主机 127.0.0.1:8083（容器内 8848）
# 证书：*.alvis.org.cn 通配符已覆盖本子域，复用同一份，无需单独签发

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.alvis.org.cn;

    ssl_certificate     /etc/nginx/ssl/alvis.org.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/alvis.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;

    # 面板本身只有几十 KB，限制请求体
    client_max_body_size 2m;

    # 常规请求
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 实时推送通道，单独透传升级头
    # 不用 $connection_upgrade 是为了不给 nginx.conf 额外加 map
    location /ws {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长连接不断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
